<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>红旗社</title>
    <!-- Markdown 解析库 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* ===== 全局重置 & 布局 ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: '楷体', 'KaiTi', serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #f4f4f4;
        }

        /* ===== 顶部标题（占1/3，纯白背景） ===== */
        .header {
            height: 33vh;
            min-height: 150px;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            border-bottom: 2px solid #e0e0e0;
            flex-shrink: 0;
        }
        .header h1 {
            font-size: 4.5rem;
            color: #000;
            font-weight: normal;
            letter-spacing: 0.8rem;
            animation: fadeDown 0.8s ease-out;
        }
        @keyframes fadeDown {
            0% { opacity: 0; transform: translateY(-30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* ===== 主体（导航 + 内容） ===== */
        .main {
            flex: 1;
            display: flex;
            min-height: 0; /* 防止flex溢出 */
        }

        /* ---- 左侧导航（动态渲染） ---- */
        .nav {
            width: 200px;
            background: #f0f0f0;
            padding: 25px 15px;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex-shrink: 0;
        }
        .nav a {
            display: block;
            padding: 10px 15px;
            color: #222;
            text-decoration: none;
            font-size: 1.15rem;
            border-radius: 6px;
            transition: all 0.25s ease;
            background: transparent;
        }
        .nav a:hover {
            background: #d0d0d0;
            transform: translateX(6px);
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }
        /* 当前激活的导航项（利用 hash 高亮） */
        .nav a.active {
            background: #c0c0c0;
            font-weight: bold;
            border-left: 4px solid #333;
        }

        /* ---- 右侧内容区 ---- */
        .content {
            flex: 1;
            padding: 30px 40px;
            overflow-y: auto;
            background: #ffffff;
            position: relative;
        }

        /* 加载动画（旋转圈） */
        .loading-spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
            gap: 15px;
            color: #666;
        }
        .spinner {
            width: 30px;
            height: 30px;
            border: 4px solid #e0e0e0;
            border-top: 4px solid #333;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 内容切换淡入动画 */
        .fade-in {
            animation: fadeIn 0.4s ease forwards;
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(12px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* ---- 新闻列表样式 ---- */
        .news-item {
            padding: 14px 10px;
            border-bottom: 1px dashed #e0e0e0;
            cursor: pointer;
            transition: background 0.15s;
            border-radius: 4px;
        }
        .news-item:hover {
            background: #f2f6fc;
        }
        .news-date {
            font-size: 0.9rem;
            color: #888;
            margin-right: 25px;
            display: inline-block;
            width: 100px;
        }
        .news-title {
            font-size: 1.1rem;
            color: #1a1a1a;
        }

        /* ---- 详情展示 ---- */
        .detail-container {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px solid #eee;
        }
        .detail-container h2 {
            font-size: 1.8rem;
            margin-bottom: 15px;
        }
        .markdown-body {
            line-height: 1.9;
            font-size: 1.05rem;
        }
        .markdown-body h1, 
        .markdown-body h2, 
        .markdown-body h3 { margin: 18px 0 10px; }
        .markdown-body p { margin: 10px 0; }
        .markdown-body ul, 
        .markdown-body ol { margin-left: 22px; }

        /* 空状态欢迎语 */
        .welcome-msg {
            text-align: center;
            color: #999;
            font-size: 1.6rem;
            margin-top: 15%;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 700px) {
            .header h1 { font-size: 2.8rem; letter-spacing: 0.3rem; }
            .nav { width: 140px; padding: 15px 8px; }
            .nav a { font-size: 1rem; padding: 8px 10px; }
            .content { padding: 20px; }
            .news-date { width: 80px; margin-right: 10px; }
        }
    </style>
</head>
<body>

    <!-- 顶部标题 -->
    <div class="header">
        <h1>红旗社</h1>
    </div>

    <!-- 主体 -->
    <div class="main">
        <nav class="nav" id="navContainer">
            <!-- JS 动态生成导航 -->
        </nav>
        <div class="content" id="contentContainer">
            <!-- JS 动态渲染内容 -->
        </div>
    </div>

    <script>
        // ============================================================
        //  1. 加载配置文件 data/config.json
        // ============================================================
        let appData = null; // 存储全局数据

        async function loadConfig() {
            try {
                const res = await fetch('data/config.json');
                if (!res.ok) throw new Error('配置文件加载失败');
                appData = await res.json();
                initApp(); // 数据加载完成后初始化
            } catch (err) {
                document.getElementById('contentContainer').innerHTML = `
                    <div style="color:red; padding:20px;">
                        ⚠️ 无法加载数据配置，请检查 <code>data/config.json</code> 是否存在。<br>
                        错误：${err.message}
                    </div>
                `;
            }
        }

        // ============================================================
        //  2. 初始化应用：渲染导航 + 处理路由
        // ============================================================
        function initApp() {
            renderNav();
            // 监听 hash 变化（浏览器前进/后退）
            window.addEventListener('hashchange', handleRoute);
            // 初始加载时根据 URL hash 或默认显示第一条新闻
            handleRoute();
        }

        // ---- 渲染左侧导航 ----
        function renderNav() {
            const nav = document.getElementById('navContainer');
            const items = appData.navItems || [];
            let html = '';
            items.forEach(item => {
                // 设置 data-link 属性，点击时切换页面而不刷新
                html += `<a href="#${item.link}" data-link="${item.link}">${item.name}</a>`;
            });
            nav.innerHTML = html;

            // 给导航绑定点击事件（拦截默认跳转，使用动态加载）
            nav.querySelectorAll('a').forEach(a => {
                a.addEventListener('click', function(e) {
                    e.preventDefault();
                    const link = this.dataset.link;
                    // 更新 URL hash，触发 handleRoute
                    window.location.hash = link;
                });
            });
        }

        // ---- 路由处理器 ----
        async function handleRoute() {
            const hash = window.location.hash.replace('#', '');
            let target = hash || ''; 

            // 如果 hash 为空，默认显示新闻列表
            if (!target) {
                renderNewsList();
                return;
            }

            // 检查是否匹配 pages/ 下的文件（导航栏目）
            if (target.startsWith('pages/')) {
                await loadPage(target);
                return;
            }

            // 否则尝试匹配新闻文件（直接通过 hash 加载 md，如 #news/xxx.md）
            if (target.startsWith('news/')) {
                const newsItem = appData.newsList.find(n => n.file === target);
                if (newsItem) {
                    await loadMarkdownDetail(newsItem.file, newsItem.title);
                } else {
                    // 如果 hash 不匹配任何已知新闻，回退到新闻列表
                    renderNewsList();
                }
                return;
            }

            // 默认：显示新闻列表
            renderNewsList();
        }

        // ============================================================
        //  3. 核心渲染函数
        // ============================================================

        // ---- 3.1 渲染新闻列表（首页） ----
        function renderNewsList() {
            const container = document.getElementById('contentContainer');
            const list = appData.newsList || [];
            // 按日期降序（最新在前）
            const sorted = [...list].sort((a, b) => b.date.localeCompare(a.date));

            let html = `<h2 style="border-bottom:2px solid #333; padding-bottom:12px;">📢 公告与信息</h2>`;
            if (sorted.length === 0) {
                html += `<div class="welcome-msg">暂无公告，敬请期待</div>`;
            } else {
                sorted.forEach(item => {
                    // 点击新闻，跳转 hash 到该文件
                    html += `<div class="news-item" data-file="${item.file}" data-title="${item.title}">
                                <span class="news-date">${item.date}</span>
                                <span class="news-title">${item.title}</span>
                             </div>`;
                });
            }
            container.innerHTML = html;

            // 绑定新闻点击事件：更新 hash
            container.querySelectorAll('.news-item').forEach(el => {
                el.addEventListener('click', function() {
                    const file = this.dataset.file;
                    window.location.hash = file;
                });
            });

            // 移除所有导航的高亮，取消 active 状态
            document.querySelectorAll('.nav a').forEach(a => a.classList.remove('active'));
        }

        // ---- 3.2 加载外部 Page（html 片段） ----
        async function loadPage(filePath) {
            const container = document.getElementById('contentContainer');
            // 显示加载动画
            container.innerHTML = `<div class="loading-spinner"><div class="spinner"></div> 加载中...</div>`;

            try {
                const res = await fetch(filePath);
                if (!res.ok) throw new Error('页面不存在');
                const html = await res.text();
                container.innerHTML = `<div class="fade-in">${html}</div>`;
                // 高亮对应的导航项
                document.querySelectorAll('.nav a').forEach(a => {
                    a.classList.toggle('active', a.dataset.link === filePath);
                });
            } catch (err) {
                container.innerHTML = `<div style="color:red; padding:20px;">❌ 加载失败：${err.message}</div>`;
            }
        }

        // ---- 3.3 加载并渲染 Markdown 详情 ----
        async function loadMarkdownDetail(filePath, title) {
            const container = document.getElementById('contentContainer');
            // 显示加载动画
            container.innerHTML = `<div class="loading-spinner"><div class="spinner"></div> 加载中...</div>`;

            try {
                const res = await fetch(filePath);
                if (!res.ok) throw new Error('Markdown 文件不存在');
                const md = await res.text();
                const parsedHtml = marked.parse(md);

                // 构造新闻详情视图（包含返回列表的按钮）
                const backBtn = `<button onclick="window.location.hash=''" style="margin-bottom:20px; padding:8px 18px; background:#f0f0f0; border:1px solid #ccc; border-radius:6px; cursor:pointer; font-family:楷体;">← 返回公告列表</button>`;
                const htmlContent = `
                    <div class="fade-in">
                        ${backBtn}
                        <div class="detail-container">
                            <h2>${title}</h2>
                            <div class="markdown-body">${parsedHtml}</div>
                        </div>
                    </div>
                `;
                container.innerHTML = htmlContent;

                // 高亮对应的导航？新闻页不触发导航高亮，取消所有高亮
                document.querySelectorAll('.nav a').forEach(a => a.classList.remove('active'));
            } catch (err) {
                container.innerHTML = `<div style="color:red; padding:20px;">❌ 加载 Markdown 失败：${err.message}</div>`;
            }
        }

        // ============================================================
        //  4. 启动应用
        // ============================================================
        loadConfig();
    </script>

</body>
</html>
